<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sonata Music Studio</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --gradient: linear-gradient(90deg, #0057ff, #6a00ff, #c10000, #ff8c00, #ffd700);
      --bg-dark: #111;
      --text-light: #f4f4f4;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Roboto', sans-serif;
      background: var(--bg-dark);
      color: var(--text-light);
      line-height: 1.6;
    }

    header {
      display: flex;
      align-items: center;
      padding: 1rem 2rem;
      background: #000;
    }

    header img {
      height: 50px;
      margin-right: 1rem;
    }

    header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 1.5rem;
      font-weight: 700;
    }

    .hero {
      text-align: center;
      padding: 3rem 1rem;
    }

    .hero img {
      max-width: 250px;
      height: auto;
      border-radius: 0;
      margin-bottom: 1rem;
      box-shadow: 0 0 40px rgba(255,255,255,0.2);
    }

    .hero h2 {
      font-family: 'Playfair Display', serif;
      font-size: 2.2rem;
      margin-bottom: 0.5rem;
    }

    .divider {
      height: 6px;
      background: var(--gradient);
      margin: 0.8rem auto 2rem;
      max-width: 300px;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
      padding: 0 15px;
    }

    .profile img, .logo img {
      width: 100%;
      height: auto;
      display: block;
      margin: 0 auto;
    }

    .profile img {
      max-width: 400px;
    }

    .profile {
      display: flex;
      justify-content: center;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <img src="https://raw.githubusercontent.com/sonatamusicstudio/sonata-music-studio/main/output-onlinepngtools%20(2).png" alt="Logo">
    <h1>Sonata Music Studio</h1>
  </header>

  <!-- Hero -->
  <section class="hero">
    <img src="https://raw.githubusercontent.com/sonatamusicstudio/sonata-music-studio/main/Screenshot_20250905_083441_Gallery.jpg" alt="Felix Satia">
    <h2>Felix Satia</h2>
    <div class="divider"></div>
  </section>

  <!-- Program -->
  <section id="program">
    <h2>Program</h2>
    <div class="divider"></div>
    <div class="program-grid">
      <div class="program-item">Piano Lessons</div>
      <div class="program-item">Music Theory</div>
      <div class="program-item">Choir Training</div>
    </div>
  </section>
