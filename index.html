<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sonata Music Studio</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Roboto:wght@300;400&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Roboto', sans-serif;
      background: linear-gradient(135deg, #0a0f29, #1d0f2e);
      color: white;
      overflow-x: hidden;
    }

    .hero {
      position: relative;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      overflow: hidden;
    }

    /* background grid lines */
    .hero::before, .hero::after {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: 
        linear-gradient(to right, rgba(255,255,255,0.05) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255,255,255,0.05) 1px, transparent 1px);
      background-size: 80px 80px;
      z-index: 1;
    }

    .hero img {
      position: relative;
      z-index: 2;
      max-width: 250px;
      border-radius: 12px;
      box-shadow: 0 0 40px rgba(255,255,255,0.15);
    }

    .hero-text {
      position: absolute;
      z-index: 3;
      bottom: 15%;
      left: 50%;
      transform: translateX(-50%);
    }

    .hero-text h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2.5rem;
      letter-spacing: 2px;
      margin-bottom: 10px;
    }

    .hero-text h2 {
      font-weight: 300;
      font-size: 1.2rem;
      margin-bottom: 15px;
      opacity: 0.85;
    }

    .hero-text p {
      font-style: italic;
      font-size: 1rem;
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <section class="hero">
    <img src="Screenshot_20250905_083441_Gallery.jpg" alt="Founder Photo">
    <div class="hero-text">
      <h1>Sonata Music Studio</h1>
      <h2>Felix Satia — Founder & Instructor</h2>
      <p>Where Sound Becomes Art</p>
    </div>
  </section>
</body>
</html>
