<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sonata Music Studio - Gallery Premium</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Roboto:wght@300;400&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Roboto', sans-serif;
      background: linear-gradient(180deg, #0a0f3d, #1a144d);
      color: #fff;
    }

    h1, h2 {
      font-family: 'Playfair Display', serif;
    }

    .gallery {
      max-width: 1000px;
      margin: 50px auto;
      padding: 0 20px;
    }

    .gallery h2 {
      font-size: 2.5rem;
      text-align: center;
      margin-bottom: 40px;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 25px;
    }

    .gallery-grid img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      border: 2px solid rgba(255, 215, 0, 0.4); /* subtle gold frame */
      box-shadow: 0 8px 20px rgba(0,0,0,0.5);
      cursor: pointer;
      transition: transform 0.3s, box-shadow 0.3s;
    }

    .gallery-grid img:hover {
      transform: scale(1.03);
      box-shadow: 0 12px 30px rgba(0,0,0,0.7);
    }

    /* Lightbox */
    .lightbox {
      display: none;
      position: fixed;
      z-index: 999;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.95);
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }

    .lightbox img {
      max-width: 80%;
      max-height: 80%;
      margin-bottom: 15px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.8);
    }

    .lightbox h3 {
      font-family: 'Playfair Display', serif;
      font-size: 1.5rem;
      color: #ffd700; /* gold accent */
      margin: 0;
    }

    .lightbox p {
      font-family: 'Roboto', sans-serif;
      font-size: 1rem;
      opacity: 0.9;
      max-width: 80%;
      text-align: center;
    }

    .lightbox .close {
      position: absolute;
      top: 20px;
      right: 40px;
      font-size: 2rem;
      cursor: pointer;
      color: #ffd700;
    }

    @media (max-width: 900px) {
      .gallery-grid {
        grid-template-columns: repeat(2, 1fr);
      }
      .gallery-grid img {
        height: 180px;
      }
    }

    @media (max-width: 600px) {
      .gallery-grid {
        grid-template-columns: 1fr;
      }
      .gallery-grid img {
        height: 150px;
      }
    }
  </style>
</head>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox">
    <span class="close" id="close">&times;</span>
    <img src="" alt="" id="lightbox-img">
    <h3 id="lightbox-title"></h3>
    <p id="lightbox-desc"></p>
  </div>

  <script>
    const images = document.querySelectorAll('.gallery-grid img');
    const lightbox = document.getElementById('lightbox');
    const lbImg = document.getElementById('lightbox-img');
    const lbTitle = document.getElementById('lightbox-title');
    const lbDesc = document.getElementById('lightbox-desc');
    const closeBtn = document.getElementById('close');

    images.forEach(img => {
      img.addEventListener('click', () => {
        lbImg.src = img.src;
        lbTitle.textContent = img.dataset.title;
        lbDesc.textContent = img.dataset.desc;
        lightbox.style.display = 'flex';
      });
    });

    closeBtn.addEventListener('click', () => {
      lightbox.style.display = 'none';
    });

    lightbox.addEventListener('click', e => {
      if(e.target === lightbox) lightbox.style.display = 'none';
    });
  </script>
